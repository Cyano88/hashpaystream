name: Production readiness monitor

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-readiness-monitor
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe public readiness boundary
        env:
          ENDPOINT: https://hashpaystream.app/readyz
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            headers="$(mktemp)"
            body="$(mktemp)"
            status='request_failed'
            if response_status=$(curl --silent --show-error \
              --connect-timeout 5 \
              --max-time 10 \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              "$ENDPOINT"); then
              status="$response_status"
            fi

            if [ "$status" = '200' ] \
              && grep --extended-regexp --ignore-case --quiet '^cache-control:.*no-store' "$headers" \
              && python3 - "$body" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as response:
              payload = json.load(response)
          expected = {'ok': True, 'service': 'hashpaystream', 'status': 'ready'}
          if payload != expected:
              raise SystemExit(1)
          PY
            then
              echo "Readiness probe passed on attempt $attempt."
              exit 0
            fi

            ray=$(awk 'BEGIN { IGNORECASE=1 } /^cf-ray:/ { gsub("\r", "", $2); print $2 }' "$headers" | tail -n 1)
            echo "Readiness probe attempt $attempt failed: status=$status cf_ray=${ray:-unavailable}"
            rm -f "$headers" "$body"
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done

          echo 'Production readiness failed three consecutive probes.'
          exit 1

      - name: Probe Trade availability and authentication boundaries
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const origin = 'https://hashpaystream.onrender.com';
          const checks = [
            ['/api/hashpaystream/v1/trade/listings', 200],
            ['/api/hashpaystream/v1/trade/conversations', 401],
            ['/api/hashpaystream/v1/trade/moderation', 401],
          ];
          let failed = false;
          for (let attempt = 1; attempt <= 3; attempt++) {
            const results = await Promise.all(checks.map(async ([path, expected]) => {
              try {
                const response = await fetch(origin + path, {
                  signal: AbortSignal.timeout(10000),
                  cache: 'no-store',
                  redirect: 'error',
                });
                const body = await response.json();
                const passed = response.status === expected && (
                  expected === 200
                    ? body?.ok === true && body?.enabled === true && Array.isArray(body?.listings)
                    : body?.ok === false
                );
                // Never log response bodies, listings, identities or credentials.
                console.log(JSON.stringify({ path, attempt, status: response.status, passed }));
                return passed;
              } catch {
                console.log(JSON.stringify({ path, attempt, passed: false, error: 'Request failed' }));
                return false;
              }
            }));
            failed = results.some(passed => !passed);
            if (!failed) break;
            if (attempt < 3) await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (failed) {
            console.error('Trade checks failed three consecutive attempts.');
            process.exitCode = 1;
          }
          JS
