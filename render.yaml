services:
  - type: web
    name: hashpaystream
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /readyz
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: VITE_CIRCLE_USER_WALLET_APP_ID_ARC_TESTNET
        sync: false
      - key: CIRCLE_TEST_API_KEY
        sync: false
      - key: HASHPAYSTREAM_ADMIN_EMAILS
        sync: false
      - key: VITE_HASH_PAYLINK_BASE_URL
        value: https://app.hashpaylink.com
      - key: HASHPAYSTREAM_HASH_PAYLINK_BASE_URL
        value: https://app.hashpaylink.com
      - key: HASHPAYSTREAM_ARC_API_KEY
        sync: false
      - key: HASHPAYSTREAM_ARC_PROJECT_ID
        sync: false
      - key: HASHPAYSTREAM_ARC_WEBHOOK_SECRET
        sync: false
      - key: HASHPAYSTREAM_ARC_WEBHOOK_STORE_KEY
        value: hashpaystream:arc-webhooks:v1
      - key: HASHPAYSTREAM_APP_OWNERSHIP_SECRET
        sync: false
      - key: HASHPAYSTREAM_HUMAN_AGREEMENT_STORE_KEY
        value: hashpaystream:human-agreement-owners:v1
      - key: HASHPAYSTREAM_UPFRONT_AGREEMENT_STORE_KEY
        value: hashpaystream:upfront-agreement-owners:v1
      - key: HASHPAYSTREAM_AGENT_AGREEMENT_STORE_KEY
        value: hashpaystream:agent-agreement-owners:v1
      - key: HASHPAYSTREAM_UPFRONT_ENABLED
        value: "true"
      - key: VITE_HASHPAYSTREAM_UPFRONT_ENABLED
        value: "true"
      - key: HASHPAYSTREAM_FEE_SETTLEMENT_V3_ENABLED
        value: "false"
      - key: VITE_HASHPAYSTREAM_FEE_SETTLEMENT_V3_ENABLED
        value: "false"
      - key: HASHPAYSTREAM_DIRECT_ARC_ENABLED
        value: "true"
      - key: VITE_HASHPAYSTREAM_DIRECT_ARC_ENABLED
        value: "false"
      - key: VITE_HASHPAYSTREAM_UPFRONT_ARC_ROUTER_ADDRESS
        value: "0xF4D6700B383b6b8Eb14c3b43d5124444D2ecb7b9"
      - key: HASHPAYSTREAM_UPFRONT_STORE_KEY
        value: hashpaystream:upfront-assessments:v1
      - key: HASHPAYSTREAM_UPFRONT_ARC_API_KEY
        sync: false
      - key: HASHPAYSTREAM_UPFRONT_ARC_PROJECT_ID
        sync: false
      - key: HASHPAYSTREAM_UPFRONT_ARC_WEBHOOK_SECRET
        sync: false
      - key: HASHPAYSTREAM_UPFRONT_ARC_WEBHOOK_STORE_KEY
        value: hashpaystream:upfront-arc-webhooks:v1
      - key: HASHPAYSTREAM_UPFRONT_ARC_ROUTER_ADDRESS
        value: "0xF4D6700B383b6b8Eb14c3b43d5124444D2ecb7b9"
      - key: HASHPAYSTREAM_ZEROSCOUT_BASE_URL
        sync: false
      - key: HASHPAYSTREAM_ZEROSCOUT_API_KEY
        sync: false
      - key: HASHPAYSTREAM_POLYDESK_BASE_URL
        sync: false
      - key: HASHPAYSTREAM_POLYDESK_SERVICE_TOKEN
        sync: false
      - key: HASHPAYSTREAM_POLYDESK_SIGNING_SECRET
        sync: false
      - key: HASHPAYSTREAM_POLYDESK_SIGNING_KEY_ID
