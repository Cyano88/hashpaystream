services:
  - type: web
    name: hashpaystream
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /readyz
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: HASHPAYSTREAM_ADMIN_EMAILS
        sync: false
      - key: VITE_HASH_PAYLINK_BASE_URL
        value: https://app.hashpaylink.com
      - key: HASHPAYSTREAM_HASH_PAYLINK_BASE_URL
        value: https://app.hashpaylink.com
      - key: HASHPAYSTREAM_ARC_API_KEY
        sync: false
      - key: HASHPAYSTREAM_ARC_PROJECT_ID
        sync: false
      - key: HASHPAYSTREAM_ARC_WEBHOOK_SECRET
        sync: false
      - key: HASHPAYSTREAM_ARC_WEBHOOK_STORE_KEY
        value: hashpaystream:arc-webhooks:v1
      - key: HASHPAYSTREAM_APP_OWNERSHIP_SECRET
        sync: false
      - key: HASHPAYSTREAM_APP_OWNERSHIP_STORE_KEY
        value: hashpaystream:agreement-owners:v1
      - key: HASHPAYSTREAM_UPFRONT_ENABLED
        value: "true"
      - key: VITE_HASHPAYSTREAM_UPFRONT_ENABLED
        value: "true"
      - key: VITE_HASHPAYSTREAM_UPFRONT_ARC_ROUTER_ADDRESS
        sync: false
      - key: HASHPAYSTREAM_UPFRONT_STORE_KEY
        value: hashpaystream:upfront-assessments:v1
      - key: HASHPAYSTREAM_UPFRONT_ARC_API_KEY
        sync: false
      - key: HASHPAYSTREAM_UPFRONT_ARC_PROJECT_ID
        sync: false
      - key: HASHPAYSTREAM_UPFRONT_ARC_WEBHOOK_SECRET
        sync: false
      - key: HASHPAYSTREAM_UPFRONT_ARC_WEBHOOK_STORE_KEY
        value: hashpaystream:upfront-arc-webhooks:v1
      - key: HASHPAYSTREAM_UPFRONT_ARC_ROUTER_ADDRESS
        sync: false
      - key: HASHPAYSTREAM_ZEROSCOUT_BASE_URL
        sync: false
      - key: HASHPAYSTREAM_ZEROSCOUT_API_KEY
        sync: false
      - key: HASHPAYSTREAM_POLYDESK_BASE_URL
        sync: false
      - key: HASHPAYSTREAM_POLYDESK_SERVICE_TOKEN
        sync: false
      - key: HASHPAYSTREAM_POLYDESK_SIGNING_SECRET
        sync: false
      - key: HASHPAYSTREAM_POLYDESK_SIGNING_KEY_ID
        sync: false
      - key: HASHPAYSTREAM_POLYDESK_EIP712_SIGNER
        sync: false
      - key: HASHPAYSTREAM_UPFRONT_ESCROW_CONTRACT_ADDRESS
        sync: false
      - key: HASHPAYSTREAM_UPFRONT_CHAIN_ID
        value: "196"
      - key: VITE_HASHPAYSTREAM_UPFRONT_CHAIN_ID
        value: "196"
      - key: VITE_HASHPAYSTREAM_UPFRONT_ESCROW_CONTRACT_ADDRESS
        value: "0xa07900cAb0a0BbFBC52FCC95b22c52a22Ff0e1A5"
      - key: VITE_HASHPAYSTREAM_UPFRONT_REPAYMENT_RECIPIENT
        value: "0x295177803fd02e1880d661Be3b66F6124787f978"
      - key: VITE_HASHPAYSTREAM_UPFRONT_TREASURY_ENABLED
        value: "true"
      - key: HASHPAYSTREAM_XLAYER_RPC_URL
        value: https://rpc.xlayer.tech
      - key: HASHPAYSTREAM_UPFRONT_PROTECTION_PRIVATE_KEY
        sync: false
      - key: HASHPAYSTREAM_UPFRONT_PROTECTION_SIGNER
        sync: false
      - key: HASHPAYSTREAM_UPFRONT_REPAYMENT_PRIVATE_KEY
        sync: false
      - key: HASHPAYSTREAM_UPFRONT_REPAYMENT_SIGNER
        sync: false
      - key: HASHPAYSTREAM_UPFRONT_FUNDER_EMAILS
        sync: false
      - key: HASHPAYSTREAM_UPFRONT_FUNDER_WALLETS
        value: "0x85a530abbe102d1bf4fd084551944b0cdd94dbf4"
      - key: HASHPAYSTREAM_AGENT_CREDENTIAL_PEPPER
        sync: false
      - key: HASHPAYSTREAM_AGENT_CREDENTIAL_STORE_KEY
        value: hashpaystream:agent-credentials:v1
      - key: HASHPAYSTREAM_AGENT_ARC_API_KEY
        sync: false
      - key: HASHPAYSTREAM_AGENT_ARC_PROJECT_ID
        sync: false
      - key: HASHPAYSTREAM_AGENT_ARC_WEBHOOK_SECRET
        sync: false
      - key: HASHPAYSTREAM_AGENT_ARC_WEBHOOK_STORE_KEY
        value: hashpaystream:agent-arc-webhooks:v1
      - key: HASHPAYSTREAM_CIRCLE_MARKETPLACE_SELLER_ADDRESS
        sync: false
      - key: HASHPAYSTREAM_CIRCLE_MARKETPLACE_PRICE_USD
        value: "0.01"
      - key: HASHPAYSTREAM_CIRCLE_MARKETPLACE_FACILITATOR_URL
        value: https://gateway-api-testnet.circle.com
      - key: DATABASE_URL
        fromDatabase:
          name: hashpaystream-db
          property: connectionString

databases:
  - name: hashpaystream-db
    plan: basic-256mb
