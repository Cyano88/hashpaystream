      - key: VITE_HASHPAYSTREAM_UPFRONT_CHAIN_ID
        value: "196"
      - key: VITE_HASHPAYSTREAM_UPFRONT_ESCROW_CONTRACT_ADDRESS
        value: "0xCA4f547527A64a94c9b45306f311D8658d8A3Dbf"
      - key: VITE_HASHPAYSTREAM_UPFRONT_TREASURY_ENABLED
        value: "true"
      - key: HASHPAYSTREAM_XLAYER_RPC_URL
